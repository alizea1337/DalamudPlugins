name: Suggestion
description: An idea, a feature, or something you'd like to work differently.
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. English or German is fine.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Provenance
        - Keystroke
        - Both, or not sure
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What the plugin should do, or do differently.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: When you'd use it, and how you get around it now.
