name: Bug report
description: Something in a plugin doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. English or German is fine.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Provenance
        - Keystroke
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown in /xlplugins, and on the second line of Provenance's bug report.
      placeholder: "0.15.2"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you were doing, what the plugin did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Provenance bug report
      description: >-
        For Provenance: press "Copy bug report" in Settings → General (or type /provenance bugreport)
        right after it happens, then paste it here. It has no character name, world or retainer names.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images in here.
