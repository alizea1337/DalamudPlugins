name: Release plugin

# Tag format: <Plugin>-v<version>[-testing]
#   Keystroke-v0.1.0          -> stable track
#   Keystroke-v0.1.0-testing  -> testing track only
on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Parse tag
        id: tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^(?<plugin>[A-Za-z0-9]+)-v(?<version>\d+\.\d+\.\d+(\.\d+)?)(?<testing>-testing)?$') {
            throw "Tag '$tag' does not match <Plugin>-v<version>[-testing]"
          }
          "plugin=$($Matches.plugin)" >> $env:GITHUB_OUTPUT
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "testing=$([bool]$Matches.testing)" >> $env:GITHUB_OUTPUT

      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build raphael-cli (Provenance)
        if: steps.tag.outputs.plugin == 'Provenance'
        shell: pwsh
        run: |
          # Pinned so every release ships the same solver; bump deliberately.
          git clone https://github.com/KonaeAkira/raphael-rs.git raphael-rs
          git -C raphael-rs checkout 9311b0d262259bd8db727fbec2dfd08ff453b87b
          if ($LASTEXITCODE -ne 0) { throw "raphael-rs checkout failed" }
          # Provenance's patch: raphael-cli's serve mode (re-planning mid-craft), see plugins/Provenance/NOTICE.md.
          git -C raphael-rs apply --check "$PWD/plugins/Provenance/Raphael/raphael-rs-serve.patch"
          if ($LASTEXITCODE -ne 0) { throw "The raphael-rs patch doesn't apply" }
          git -C raphael-rs apply "$PWD/plugins/Provenance/Raphael/raphael-rs-serve.patch"
          if ($LASTEXITCODE -ne 0) { throw "The raphael-rs patch doesn't apply" }
          cargo build --release --package raphael-cli --manifest-path raphael-rs/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "raphael-cli build failed" }
          Copy-Item raphael-rs/target/release/raphael-cli.exe plugins/Provenance/Resources/raphael-cli.exe -Force
          Copy-Item raphael-rs/LICENSE plugins/Provenance/Resources/LICENSE-raphael.txt -Force

      - name: Test
        shell: pwsh
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          PROVENANCE_REQUIRE_RAPHAEL: '1'
          PROVENANCE_RAPHAEL_EXE: ${{ github.workspace }}/plugins/Provenance/Resources/raphael-cli.exe
        run: |
          $tests = "plugins/$env:PLUGIN.Tests"
          if ($env:PLUGIN -eq 'Provenance' -or (Test-Path $tests)) { dotnet test $tests -c Release } else { Write-Host 'No test project for this plugin' }

      - name: Build
        shell: pwsh
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $v = $env:VERSION
          if ($v.Split('.').Count -eq 3) { $v = "$v.0" }
          dotnet build "plugins/$env:PLUGIN" -c Release -p:Version=$v

      - name: Collect package
        id: pkg
        shell: pwsh
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
        run: |
          $plugin = $env:PLUGIN
          $zip = Get-ChildItem "plugins/$plugin/bin" -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw "latest.zip not found under plugins/$plugin/bin" }
          $out = $zip.DirectoryName
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "manifest=$out/$plugin.json" >> $env:GITHUB_OUTPUT
          $changelog = ""
          $cl = "plugins/$plugin/CHANGELOG.md"
          if (Test-Path $cl) {
            $lines = Get-Content $cl
            $start = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            if ($start) {
              $rest = $lines[$start..($lines.Count-1)]
              $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
              $section = if ($end) { $rest[0..($end-2)] } else { $rest }
              $changelog = ($section -join "`n").Trim()
            }
          }
          Set-Content -Path changelog.txt -Value $changelog -Encoding UTF8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.plugin }} ${{ steps.tag.outputs.version }}${{ steps.tag.outputs.testing == 'True' && ' (testing)' || '' }}
          prerelease: ${{ steps.tag.outputs.testing == 'True' }}
          body_path: changelog.txt
          files: ${{ steps.pkg.outputs.zip }}

      - name: Checkout main for the feed
        uses: actions/checkout@v5
        with:
          ref: main
          path: feed

      - name: Update and push repo.json
        working-directory: feed
        shell: pwsh
        env:
          MANIFEST: ${{ steps.pkg.outputs.manifest }}
          TESTING: ${{ steps.tag.outputs.testing }}
        run: |
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/latest.zip"
          $changelog = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE changelog.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another tag may have published meanwhile. Re-apply this entry to the new feed,
          # never force-push or cancel a queued release.
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Update-RepoJson.ps1') -RepoJsonPath (Join-Path $PWD 'repo.json') -ManifestPath $env:MANIFEST -DownloadUrl $url -Changelog $changelog -Testing:($env:TESTING -eq 'True')
            git add -- repo.json
            if ($LASTEXITCODE -ne 0) { throw 'Could not stage repo.json' }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host 'repo.json unchanged'; exit 0 }
            git commit -m "chore: update feed for $env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit repo.json' }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main' }
            git checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not check out the updated main' }
          }
          throw 'Could not publish repo.json after five attempts'
